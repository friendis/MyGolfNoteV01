<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birdyard 배포 도구</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#0D1117;color:#F0EDE6;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem}
.wrap{width:100%;max-width:560px}
.logo{font-family:Georgia,serif;font-size:1.4rem;color:#C8893A;letter-spacing:.15em;margin-bottom:.2rem}
.logo-sub{font-size:.7rem;color:#4a5568;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.75rem}
.card{background:#161B22;border:1px solid rgba(200,137,58,.2);border-radius:10px;padding:1.25rem;margin-bottom:.85rem}
.card-title{font-size:.67rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.dot{width:8px;height:8px;border-radius:50%}
.dot-dev{background:#A78BFA}.dot-prod{background:#C8893A}.dot-gray{background:#4a5568}
.fg{margin-bottom:.75rem}
label{display:block;font-size:.67rem;font-weight:600;color:#4a6a8a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.28rem}
input{width:100%;background:#0D1117;border:1px solid rgba(240,237,230,.12);color:#F0EDE6;padding:.5rem .75rem;border-radius:6px;font-family:inherit;font-size:.84rem;outline:none;transition:border-color .15s}
input:focus{border-color:rgba(200,137,58,.45)}
input[type=password]{letter-spacing:2px}
input[type=file]{color:#7a9ab8;border-style:dashed;font-size:.8rem}
.btn{width:100%;padding:.6rem;border-radius:6px;border:none;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.4rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-dev{background:rgba(167,139,250,.15);color:#A78BFA;border:1px solid rgba(167,139,250,.35)}
.btn-dev:hover:not(:disabled){background:rgba(167,139,250,.25)}
.btn-prod{background:rgba(200,137,58,.15);color:#C8893A;border:1px solid rgba(200,137,58,.35)}
.btn-prod:hover:not(:disabled){background:rgba(200,137,58,.25)}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.67rem;padding:2px 7px;border-radius:4px;font-weight:600}
.badge-dev{background:rgba(167,139,250,.15);color:#A78BFA;border:1px solid rgba(167,139,250,.3)}
.badge-prod{background:rgba(200,137,58,.12);color:#C8893A;border:1px solid rgba(200,137,58,.25)}
.badge-ok{background:rgba(61,158,116,.15);color:#3D9E74;border:1px solid rgba(61,158,116,.3)}
.badge-idle{background:rgba(74,101,128,.1);color:#4a6a8a;border:1px solid rgba(74,101,128,.2)}
.log{background:#0D1117;border:1px solid rgba(240,237,230,.08);border-radius:6px;padding:.65rem .9rem;min-height:60px;max-height:160px;overflow-y:auto;font-size:.76rem;font-family:'SF Mono',Consolas,monospace;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-top:.75rem}
.ok{color:#3D9E74}.err{color:#E05252}.info{color:#7a9ab8}.gold{color:#C8893A}.purple{color:#A78BFA}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid rgba(240,237,230,.06)}
.status-row:last-child{border-bottom:none}
.status-label{font-size:.74rem;color:#7a9ab8}
.warn{font-size:.71rem;color:rgba(200,137,58,.8);background:rgba(200,137,58,.07);border:1px solid rgba(200,137,58,.18);border-radius:4px;padding:.4rem .65rem;margin-top:.5rem;line-height:1.5}
.note{font-size:.68rem;color:#4a5568;line-height:1.6;margin-top:.25rem}
.arrow{text-align:center;color:#4a5568;font-size:1.1rem;margin:.2rem 0}
.tag-chip{background:rgba(240,237,230,.05);border:1px solid rgba(240,237,230,.15);color:#7a9ab8;font-size:.71rem;padding:3px 9px;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.tag-chip:hover{background:rgba(200,137,58,.1);border-color:rgba(200,137,58,.3);color:#C8893A}
textarea{width:100%;background:#0D1117;border:1px solid rgba(240,237,230,.12);color:#F0EDE6;padding:.6rem .75rem;border-radius:6px;font-family:inherit;font-size:.81rem;resize:vertical;min-height:120px;line-height:1.65;outline:none;box-sizing:border-box}
textarea:focus{border-color:rgba(200,137,58,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">BIRDYARD</div>
  <div class="logo-sub">배포 도구 · Deploy Tool</div>

  <!-- 설정 -->
  <div class="card">
    <div class="card-title"><span class="dot dot-gray"></span>GitHub 설정</div>
    <div class="fg">
      <label>사용자명</label>
      <input id="username" value="friendis">
    </div>
    <div class="fg">
      <label>저장소 이름</label>
      <input id="repo" value="MyGolfNoteV01">
    </div>
    <div class="fg">
      <label>Personal Access Token</label>
      <input type="password" id="token" placeholder="ghp_...">
      <div class="note">이 페이지 안에서만 사용되며 저장되지 않습니다.</div>
    </div>
    <div class="fg">
      <label>Anthropic API Key <span style="font-weight:400;color:#4a5568">(AI 자동 작성용)</span></label>
      <input type="password" id="anthropic-key" placeholder="sk-ant-api03-...">
      <div class="note">console.anthropic.com에서 발급. 저장되지 않습니다.</div>
    </div>
  </div>

  <!-- STEP 1 -->
  <div class="card">
    <div class="card-title">
      <span class="dot dot-dev"></span>STEP 1 — DEV 배포
      <span id="dev-badge" class="badge badge-idle" style="margin-left:auto">대기 중</span>
    </div>
    <div class="fg">
      <label>배포할 파일</label>
      <input type="file" id="dev-file" accept=".html">
    </div>
    <div style="background:rgba(167,139,250,.05);border:1px solid rgba(167,139,250,.15);border-radius:6px;padding:.55rem .75rem;margin-bottom:.75rem">
      <div class="status-row"><span class="status-label">경로</span><code style="font-size:.73rem;color:#A78BFA">dev/index.html</code></div>
      <div class="status-row"><span class="status-label">URL</span><span id="dev-url-display" style="font-size:.71rem;color:#7a9ab8">—</span></div>
    </div>
    <button class="btn btn-dev" id="dev-btn" onclick="deployDev()">⬡ DEV에 배포</button>
    <div class="log" id="dev-log">DEV 배포 로그...</div>
  </div>

  <div class="arrow">↓</div>

  <!-- STEP 2 -->
  <div class="card">
    <div class="card-title">
      <span class="dot dot-prod"></span>STEP 2 — PROD 승격
      <span id="prod-badge" class="badge badge-idle" style="margin-left:auto">대기 중</span>
    </div>
    <div class="warn">⚠ DEV에서 충분히 검증한 후에만 진행하세요.</div>
    <div style="background:rgba(200,137,58,.05);border:1px solid rgba(200,137,58,.15);border-radius:6px;padding:.55rem .75rem;margin:.75rem 0">
      <div class="status-row"><span class="status-label">경로</span><code style="font-size:.73rem;color:#C8893A">index.html</code></div>
      <div class="status-row"><span class="status-label">URL</span><span id="prod-url-display" style="font-size:.71rem;color:#7a9ab8">—</span></div>
    </div>

    <!-- 릴리즈 노트 -->
    <div class="fg">
      <label>릴리즈 노트 <span style="font-weight:400;color:#4a5568">(앱에서 사용자에게 표시)</span></label>
      <div style="display:flex;gap:.35rem;margin-bottom:.4rem;flex-wrap:wrap">
        <button type="button" onclick="insertTag('✨ 새 기능')" class="tag-chip">✨ 새 기능</button>
        <button type="button" onclick="insertTag('🐛 버그 수정')" class="tag-chip">🐛 버그 수정</button>
        <button type="button" onclick="insertTag('⚡ 성능 개선')" class="tag-chip">⚡ 성능</button>
        <button type="button" onclick="insertTag('🎨 UI 개선')" class="tag-chip">🎨 UI</button>
        <button type="button" id="ai-gen-btn" onclick="autoGenerateNotes()"
          class="tag-chip" style="background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.4);color:#A78BFA;margin-left:auto;font-weight:600">
          ✦ AI 자동 작성
        </button>
      </div>
      <div id="ai-gen-status" style="font-size:.71rem;color:#4a6a8a;margin-bottom:.35rem;min-height:1.2em"></div>
      <textarea id="release-notes" placeholder="이번 업데이트 내용을 작성하거나 AI 자동 작성을 눌러주세요." oninput="updateCharCount()"></textarea>
      <div style="font-size:.67rem;color:#4a5568;text-align:right;margin-top:.2rem"><span id="char-count">0</span>자</div>
    </div>

    <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem">
      <input type="checkbox" id="prod-confirm" style="width:auto;accent-color:#C8893A">
      <label for="prod-confirm" style="font-size:.77rem;color:#7a9ab8;text-transform:none;letter-spacing:0;cursor:pointer;margin:0">DEV 테스트 완료. PROD 배포 준비 됐습니다.</label>
    </div>
    <button class="btn btn-prod" id="prod-btn" onclick="deployProd()" disabled>🚀 PROD에 배포 (승격)</button>
    <div class="log" id="prod-log">PROD 배포 로그...</div>
  </div>

  <!-- 히스토리 -->
  <div class="card">
    <div class="card-title"><span class="dot dot-gray"></span>배포 기록</div>
    <div id="history" style="font-size:.74rem;color:#4a5568;line-height:1.9">아직 배포 기록 없음</div>
  </div>
</div>

<script>
let devContent = null;
const deployHistory = [];

// 초기화
document.getElementById('username').addEventListener('input', updateUrls);
document.getElementById('repo').addEventListener('input', updateUrls);
document.getElementById('prod-confirm').addEventListener('change', function(){
  document.getElementById('prod-btn').disabled = !this.checked;
});
updateUrls();

function updateUrls(){
  const u = document.getElementById('username').value.trim();
  const r = document.getElementById('repo').value.trim();
  if(u&&r){
    document.getElementById('dev-url-display').textContent = `https://${u}.github.io/${r}/dev/`;
    document.getElementById('prod-url-display').textContent = `https://${u}.github.io/${r}/`;
  }
}

function updateCharCount(){
  document.getElementById('char-count').textContent = document.getElementById('release-notes').value.length;
}

function logTo(id, msg, cls='info'){
  const el=document.getElementById(id);
  const t=new Date().toLocaleTimeString('ko-KR');
  el.innerHTML += `<span class="${cls}">[${t}] ${msg}\n</span>`;
  el.scrollTop=el.scrollHeight;
}
function clearLog(id){ document.getElementById(id).innerHTML=''; }

function getInputs(){
  return {
    username: document.getElementById('username').value.trim(),
    repo: document.getElementById('repo').value.trim(),
    token: document.getElementById('token').value.trim(),
  };
}

function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=rej;
    r.readAsText(file,'UTF-8');
  });
}
function toB64(str){ return btoa(unescape(encodeURIComponent(str))); }

async function getSHA(apiBase,path,headers){
  const res=await fetch(`${apiBase}/contents/${path}`,{headers});
  if(res.ok){ const d=await res.json(); return d.sha; }
  return null;
}
async function putFile(apiBase,path,content,message,sha,headers){
  const body={message,content:toB64(content),...(sha?{sha}:{})};
  const res=await fetch(`${apiBase}/contents/${path}`,{method:'PUT',headers,body:JSON.stringify(body)});
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||'업로드 실패'); }
  return await res.json();
}

// ── DEV 배포 ─────────────────────────────────────────
async function deployDev(){
  const {username,repo,token}=getInputs();
  const fileInput=document.getElementById('dev-file');
  const btn=document.getElementById('dev-btn');
  const badge=document.getElementById('dev-badge');
  if(!username||!repo||!token){logTo('dev-log','GitHub 설정을 입력해주세요','err');return;}
  if(!fileInput.files[0]){logTo('dev-log','파일을 선택해주세요','err');return;}
  btn.disabled=true; btn.textContent='배포 중...';
  badge.className='badge badge-dev'; badge.textContent='배포 중...';
  clearLog('dev-log');
  try{
    logTo('dev-log','파일 읽는 중...','purple');
    const content=await readFile(fileInput.files[0]);
    logTo('dev-log',`파일 크기: ${(content.length/1024).toFixed(1)}KB`,'ok');
    const headers={'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
    const apiBase=`https://api.github.com/repos/${username}/${repo}`;
    const sha=await getSHA(apiBase,'dev/index.html',headers);
    logTo('dev-log',sha?`기존 파일 SHA: ${sha.slice(0,7)}...`:'dev/index.html 없음 — 신규 생성','info');
    const result=await putFile(apiBase,'dev/index.html',content,`🧪 DEV 배포 ${new Date().toLocaleString('ko-KR')}`,sha,headers);
    devContent=content;
    logTo('dev-log',`완료! 커밋: ${result.commit?.sha?.slice(0,7)}`,'ok');
    logTo('dev-log',`DEV URL: https://${username}.github.io/${repo}/dev/`,'gold');
    logTo('dev-log','※ 반영까지 1~2분 소요','info');
    badge.className='badge badge-ok'; badge.textContent='✓ 완료';
    addHistory('DEV',fileInput.files[0].name,result.commit?.sha?.slice(0,7),`https://${username}.github.io/${repo}/dev/`);
  }catch(e){
    logTo('dev-log',`오류: ${e.message}`,'err');
    badge.className='badge badge-idle'; badge.textContent='실패';
  }finally{
    btn.disabled=false; btn.textContent='⬡ DEV에 배포';
  }
}

// ── AI 릴리즈 노트 자동 생성 (내장 Claude API 사용) ──
async function autoGenerateNotes(){
  if(!devContent){
    alert('DEV 배포를 먼저 진행해주세요.');
    return;
  }
  const anthropicKey=document.getElementById('anthropic-key').value.trim();
  if(!anthropicKey){
    alert('설정에서 Anthropic API Key를 먼저 입력해주세요.\nconsole.anthropic.com에서 발급받을 수 있습니다.');
    document.getElementById('anthropic-key').focus();
    return;
  }
  const btn=document.getElementById('ai-gen-btn');
  const status=document.getElementById('ai-gen-status');
  btn.disabled=true; btn.textContent='✦ 분석 중...';
  status.textContent='PROD 파일 가져오는 중...'; status.style.color='#4a6a8a';

  try{
    // 1. 현재 PROD 파일 가져오기
    const {username,repo,token}=getInputs();
    const headers={'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github.v3+json','X-GitHub-Api-Version':'2022-11-28'};
    const apiBase=`https://api.github.com/repos/${username}/${repo}`;
    let prodContent='';
    const res=await fetch(`${apiBase}/contents/index.html`,{headers});
    if(res.ok){
      const data=await res.json();
      const binary=atob(data.content.replace(/\n/g,''));
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      prodContent=new TextDecoder('utf-8').decode(bytes);
      status.textContent=`PROD 파일 확인 (${(prodContent.length/1024).toFixed(0)}KB) → Claude 분석 중...`;
    } else {
      status.textContent='첫 배포 → Claude 분석 중...';
    }

    // 2. 함수·UI 시그니처 diff 추출
    const extractSigs=code=>{
      const sigs=[];
      code.split('\n').forEach(line=>{
        const t=line.trim();
        if(/^window\.[a-zA-Z]+=/.test(t)) sigs.push(t.slice(0,80));
        else if(/^function [a-zA-Z]/.test(t)) sigs.push(t.slice(0,60));
        else if(/const [A-Z_]{3,}=/.test(t)) sigs.push(t.slice(0,60));
      });
      return sigs;
    };
    const extractUi=code=>[...new Set((code.match(/>[가-힣a-zA-Z ]{4,25}</g)||[]).map(m=>m.slice(1,-1).trim()).filter(Boolean))].slice(0,80);

    const prodSigs=new Set(prodContent?extractSigs(prodContent):[]);
    const devSigs=extractSigs(devContent);
    const added=devSigs.filter(s=>!prodSigs.has(s)).slice(0,25);
    const removed=prodContent?[...prodSigs].filter(s=>!devSigs.includes(s)).slice(0,15):[];
    const prodUi=new Set(prodContent?extractUi(prodContent):[]);
    const newUi=extractUi(devContent).filter(t=>!prodUi.has(t)).slice(0,25);

    const diffSummary=[
      added.length?`신규 함수/기능 (${added.length}개):\n${added.join('\n')}`:'',
      removed.length?`제거된 항목 (${removed.length}개):\n${removed.join('\n')}`:'',
      newUi.length?`새 UI 텍스트: ${newUi.join(', ')}`:''
    ].filter(Boolean).join('\n\n')||'(분석 정보 부족 — 전반적인 업데이트로 작성)';

    // 3. Claude API 호출 (Artifact 내장 — API 키 불필요)
    const claudeRes=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': document.getElementById('anthropic-key').value.trim(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:800,
        messages:[{role:'user',content:`당신은 Birdyard 골프 앱의 프로덕션 릴리즈 노트 작성자입니다. 코드 변경 사항을 분석해 실제 사용자에게 보여줄 릴리즈 노트를 작성하세요.

코드 변경 분석:
${diffSummary}

작성 규칙:
- 실제 사용자가 앱을 쓸 때 체감할 수 있는 변경사항만 포함
- 아래 항목은 절대 포함하지 말 것:
  • DEV/테스트 환경 관련 내용
  • 개발 인프라, 배포 파이프라인, 스키마 분리 등 내부 기술 변경
  • 디버깅, 로깅, 콘솔 출력 관련
  • 오타 수정이나 사소한 텍스트 변경
- 사용자 관점에서 "무엇이 달라졌는지" 중심으로 기능명으로 설명
- 이모지 섹션 형식 (해당하는 것만):
  ✨ 새 기능
  • 기능명 — 한 줄 설명

  🐛 버그 수정
  • 수정 내용

  🎨 UI 개선
  • 개선 내용

- 5~10줄 이내, 한국어로
- 확실하지 않은 내용은 포함하지 말 것`}]
      })
    });
    if(!claudeRes.ok) throw new Error(`API 오류 ${claudeRes.status}`);
    const data=await claudeRes.json();
    const generated=data.content?.[0]?.text?.trim()||'';
    if(!generated) throw new Error('응답이 비어있습니다');

    const ta=document.getElementById('release-notes');
    ta.value=generated+(ta.value.trim()?'\n\n'+ta.value:'');
    updateCharCount();
    status.textContent='✓ 자동 작성 완료! 내용을 검토하고 필요시 수정해주세요.';
    status.style.color='#3D9E74';
    btn.textContent='✦ 재생성';
  }catch(e){
    status.textContent=`오류: ${e.message}`;
    status.style.color='#E05252';
    btn.textContent='✦ AI 자동 작성';
  }finally{
    btn.disabled=false;
  }
}

// ── PROD 배포 ─────────────────────────────────────────
function buildChangelog(notes,version,commitSha){
  const now=new Date();
  const d=now.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s*/g,'-').replace(/-$/,'');
  const t=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  return `## ${version} — ${d} ${t}\n\n${notes}\n`; // 커밋 줄 제거
}

async function deployProd(){
  const {username,repo,token}=getInputs();
  const btn=document.getElementById('prod-btn');
  const badge=document.getElementById('prod-badge');
  const releaseNotes=document.getElementById('release-notes').value.trim();
  if(!devContent){logTo('prod-log','DEV 배포를 먼저 진행하세요','err');return;}
  if(!releaseNotes){logTo('prod-log','릴리즈 노트를 작성해주세요','err');document.getElementById('release-notes').focus();return;}
  if(!confirm('PROD에 배포하면 실제 사용자에게 즉시 반영됩니다.\n계속할까요?')) return;
  btn.disabled=true; btn.textContent='배포 중...';
  badge.className='badge badge-prod'; badge.textContent='배포 중...';
  clearLog('prod-log');
  const headers={'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
  const apiBase=`https://api.github.com/repos/${username}/${repo}`;
  try{
    // index.html 업로드
    logTo('prod-log','index.html SHA 확인 중...','gold');
    const sha=await getSHA(apiBase,'index.html',headers);
    const now=new Date().toLocaleString('ko-KR');
    const result=await putFile(apiBase,'index.html',devContent,`🚀 PROD 배포 ${now}`,sha,headers);
    const commitSha=result.commit?.sha?.slice(0,7);
    logTo('prod-log',`index.html 완료! 커밋: ${commitSha}`,'ok');

    // CHANGELOG.md 업로드
    logTo('prod-log','CHANGELOG.md 업데이트 중...','gold');
    const clSha=await getSHA(apiBase,'CHANGELOG.md',headers);
    let existing='';
    if(clSha){
      const r2=await fetch(`${apiBase}/contents/CHANGELOG.md`,{headers});
      if(r2.ok){const d=await r2.json();const bin=atob(d.content.replace(/\n/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);existing=new TextDecoder('utf-8').decode(bytes);}
    }
    const vNum=(existing.match(/^## /gm)||[]).length+1;
    const vStr=`v1.${vNum}`;
    const newEntry=buildChangelog(releaseNotes,vStr,commitSha);
    const header=existing.startsWith('# CHANGELOG')?'':'# CHANGELOG — Birdyard\n\n';
    const fullLog=header+newEntry+'\n'+(existing.replace(/^# CHANGELOG.*\n\n?/,'')||'');
    await putFile(apiBase,'CHANGELOG.md',fullLog,`📝 릴리즈 노트 ${vStr}`,clSha,headers);
    logTo('prod-log',`CHANGELOG.md 완료! (${vStr})`,'ok');

    const prodUrl=`https://${username}.github.io/${repo}/`;
    logTo('prod-log',`PROD URL: ${prodUrl}`,'gold');
    logTo('prod-log',`릴리즈: ${vStr}`,'purple');
    logTo('prod-log','※ 반영까지 1~2분 소요','info');
    badge.className='badge badge-ok'; badge.textContent='✓ 완료';
    document.getElementById('prod-confirm').checked=false;
    btn.disabled=true;
    document.getElementById('release-notes').value='';
    updateCharCount();
    addHistory('PROD',vStr,commitSha,prodUrl);
  }catch(e){
    logTo('prod-log',`오류: ${e.message}`,'err');
    badge.className='badge badge-idle'; badge.textContent='실패';
    btn.disabled=false; btn.textContent='🚀 PROD에 배포 (승격)';
  }
}

function insertTag(tag){
  const ta=document.getElementById('release-notes');
  const pos=ta.selectionStart;
  const before=ta.value.slice(0,pos),after=ta.value.slice(pos);
  const ins=(before&&!before.endsWith('\n')?'\n':'')+tag+'\n';
  ta.value=before+ins+after;
  ta.selectionStart=ta.selectionEnd=pos+ins.length;
  ta.focus(); updateCharCount();
}

function addHistory(type,filename,commitSha,url){
  const time=new Date().toLocaleTimeString('ko-KR');
  deployHistory.unshift({type,filename,commitSha,url,time});
  const el=document.getElementById('history');
  const color=type==='PROD'?'#C8893A':'#A78BFA';
  el.innerHTML=deployHistory.map(h=>`<div style="display:flex;gap:.4rem;align-items:baseline;padding:.15rem 0;border-bottom:1px solid rgba(240,237,230,.04)">
    <span style="color:${h.type==='PROD'?'#C8893A':'#A78BFA'};font-weight:700;font-size:.68rem;min-width:34px">${h.type}</span>
    <span style="color:#4a6a8a;font-size:.71rem">${h.time}</span>
    <span style="color:#7a9ab8;font-size:.71rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.filename}</span>
    ${h.commitSha?`<span style="color:#4a5568;font-family:monospace;font-size:.67rem;margin-left:auto;flex-shrink:0">${h.commitSha}</span>`:''}
  </div>`).join('');
}
</script>
