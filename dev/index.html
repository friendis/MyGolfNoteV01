<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birdyard 이미지 압축 도구</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#0D1117;color:#F0EDE6;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:520px}
.logo{font-family:Georgia,serif;font-size:1.3rem;color:#C8893A;letter-spacing:.15em;margin-bottom:.2rem}
.sub{font-size:.68rem;color:#4a5568;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
.card{background:#161B22;border:1px solid rgba(200,137,58,.18);border-radius:10px;padding:1.25rem;margin-bottom:.85rem}
.card-title{font-size:.67rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.9rem;color:#7a9ab8}
label{display:block;font-size:.67rem;font-weight:600;color:#4a6a8a;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.28rem}
input{width:100%;background:#0D1117;border:1px solid rgba(240,237,230,.12);color:#F0EDE6;padding:.5rem .75rem;border-radius:6px;font-family:inherit;font-size:.84rem;outline:none;margin-bottom:.75rem}
input:focus{border-color:rgba(200,137,58,.45)}
.btn{width:100%;padding:.65rem;border-radius:6px;border:none;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:rgba(29,158,117,.15);color:#3D9E74;border:1px solid rgba(29,158,117,.35)}
.btn-green:hover:not(:disabled){background:rgba(29,158,117,.25)}
.btn-stop{background:rgba(224,82,82,.12);color:#E05252;border:1px solid rgba(224,82,82,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.stat{background:#0D1117;border-radius:6px;padding:.6rem;text-align:center}
.stat-n{font-size:1.3rem;font-weight:700;color:#F0EDE6}
.stat-l{font-size:.63rem;color:#4a5568;margin-top:2px}
.bar-wrap{background:rgba(240,237,230,.06);border-radius:4px;height:8px;overflow:hidden;margin-bottom:.5rem}
.bar{height:100%;width:0%;background:#3D9E74;border-radius:4px;transition:width .3s}
.log{background:#0D1117;border:1px solid rgba(240,237,230,.07);border-radius:6px;padding:.65rem .9rem;min-height:80px;max-height:220px;overflow-y:auto;font-size:.73rem;font-family:'SF Mono',Consolas,monospace;line-height:1.8;white-space:pre-wrap;word-break:break-all;margin-top:.75rem}
.ok{color:#3D9E74}.err{color:#E05252}.info{color:#7a9ab8}.gold{color:#C8893A}
.prog-row{display:flex;justify-content:space-between;font-size:.67rem;color:#4a5568;margin-bottom:.3rem}
#login-card{display:block}
#main-card{display:none}
.warn{font-size:.71rem;color:rgba(200,137,58,.8);background:rgba(200,137,58,.07);border:1px solid rgba(200,137,58,.18);border-radius:4px;padding:.4rem .65rem;margin-bottom:.75rem;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">BIRDYARD</div>
  <div class="sub">이미지 압축 도구 · Image Compressor</div>

  <!-- 로그인 -->
  <div class="card" id="login-card">
    <div class="card-title">Supabase 로그인</div>
    <div>
      <label>이메일</label>
      <input type="email" id="email" placeholder="your@email.com">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn btn-green" id="login-btn" onclick="doLogin()">로그인</button>
    <div class="log" id="login-log">로그인하면 압축 도구가 시작됩니다.</div>
  </div>

  <!-- 메인 -->
  <div class="card" id="main-card">
    <div class="card-title">기존 이미지 일괄 압축</div>
    <div class="warn">⚠ 한 번만 실행하세요. 완료 후 이 페이지는 삭제해도 됩니다.</div>
    <div class="stats">
      <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">처리됨</div></div>
      <div class="stat"><div class="stat-n" id="s-ok">0</div><div class="stat-l">압축 완료</div></div>
      <div class="stat"><div class="stat-n" id="s-saved">0MB</div><div class="stat-l">절감</div></div>
    </div>
    <div class="prog-row">
      <span id="prog-label">진행: 0 / —</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <button class="btn btn-green" id="start-btn" onclick="startCompress()" style="margin-bottom:.4rem">🗜 압축 시작</button>
    <button class="btn btn-stop" id="stop-btn" onclick="stopCompress()" style="display:none">■ 중단</button>
    <div class="log" id="log">준비 완료.</div>
  </div>
</div>

<script>
const SB_URL = 'https://lxfyfjnugjzcvqfxevzr.supabase.co';
const SB_KEY = 'sb_publishable_z-nO7FAXTO-uYXScPuFfvA_Fp5Hh8S9';
const BUCKET = 'gdr-images';
const MAX_PX = 1200;
const QUALITY = 0.78;

// 라이브러리 로드 확인
if(typeof supabase === 'undefined' || typeof supabase.createClient !== 'function'){
  document.getElementById('login-log').innerHTML = '<span class="err">오류: Supabase 라이브러리 로드 실패. 페이지를 새로고침 해주세요.</span>';
  throw new Error('supabase not loaded');
}

const sb = supabase.createClient(SB_URL, SB_KEY);

let running = false;
let totalDone = 0, totalOk = 0, totalSavedBytes = 0;

function log(msg, cls='info'){
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString('ko-KR');
  el.innerHTML += `<span class="${cls}">[${t}] ${msg}\n</span>`;
  el.scrollTop = el.scrollHeight;
}
function loginLog(msg, cls='info'){
  const el = document.getElementById('login-log');
  el.innerHTML += `<span class="${cls}">${msg}\n</span>`;
}

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('password').value;
  const btn   = document.getElementById('login-btn');
  if(!email || !pw){ loginLog('이메일과 비밀번호를 입력해주세요', 'err'); return; }
  btn.disabled = true; btn.textContent = '로그인 중...';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error){
    loginLog('로그인 실패: ' + error.message, 'err');
    btn.disabled = false; btn.textContent = '로그인';
    return;
  }
  loginLog('✓ 로그인 성공!', 'ok');
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('main-card').style.display = 'block';
}

// 이미지 압축 (Canvas API)
function compressFile(file){
  return new Promise((res) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > MAX_PX){ h = Math.round(h * MAX_PX / w); w = MAX_PX; }
      else if(h > MAX_PX){ w = Math.round(w * MAX_PX / h); h = MAX_PX; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(blob => res(blob), 'image/jpeg', QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

// 폴더 내 파일 목록 재귀 수집
async function listAll(){
  const all = [];
  const { data: top } = await sb.storage.from(BUCKET).list('', { limit: 1000 });
  for(const item of top || []){
    if(!item.id){
      const { data: sub } = await sb.storage.from(BUCKET).list(item.name, { limit: 1000 });
      for(const f of sub || []){ if(f.id) all.push({ path: `${item.name}/${f.name}`, size: f.metadata?.size || 0 }); }
    } else {
      all.push({ path: item.name, size: item.metadata?.size || 0 });
    }
  }
  return all;
}

function updateUI(){
  const savedMb = (totalSavedBytes / 1024 / 1024).toFixed(1);
  document.getElementById('s-done').textContent  = totalDone;
  document.getElementById('s-ok').textContent    = totalOk;
  document.getElementById('s-saved').textContent = savedMb + 'MB';
}

async function startCompress(){
  if(running) return;
  running = true;
  totalDone = 0; totalOk = 0; totalSavedBytes = 0;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('stop-btn').style.display  = 'block';
  document.getElementById('log').innerHTML = '';

  log('파일 목록 가져오는 중...', 'gold');
  const files = (await listAll()).filter(f =>
    !f.path.includes('.emptyFolderPlaceholder') &&
    !f.path.toLowerCase().endsWith('.webp')
  );
  const total = files.length;
  log(`총 ${total}개 파일 확인`, 'ok');

  for(const { path, size } of files){
    if(!running) break;

    // 진행바
    const pct = Math.min(100, Math.round(totalDone / total * 100));
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('prog-label').textContent = `진행: ${totalDone} / ${total}`;
    document.getElementById('prog-pct').textContent = pct + '%';

    try {
      // 1. 다운로드
      const { data: blob, error: dlErr } = await sb.storage.from(BUCKET).download(path);
      if(dlErr || !blob){ log(`스킵 (다운로드 실패): ${path.split('/').pop()}`, 'err'); totalDone++; updateUI(); continue; }

      const origSize = blob.size;

      // 2. 압축
      const compBlob = await compressFile(new File([blob], path.split('/').pop(), { type: 'image/jpeg' }));
      if(!compBlob){ log(`스킵 (압축 실패): ${path.split('/').pop()}`, 'err'); totalDone++; updateUI(); continue; }

      // 5% 미만 절감이면 스킵
      if(compBlob.size >= origSize * 0.95){
        log(`스킵 (절감 없음): ${path.split('/').pop()} ${Math.round(origSize/1024)}KB`, 'info');
        totalDone++; updateUI(); continue;
      }

      // 3. 재업로드
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, compBlob, {
        contentType: 'image/jpeg', upsert: true
      });
      if(upErr){ log(`업로드 실패: ${path.split('/').pop()} — ${upErr.message}`, 'err'); totalDone++; updateUI(); continue; }

      const savedKb = Math.round((origSize - compBlob.size) / 1024);
      totalSavedBytes += (origSize - compBlob.size);
      totalOk++;
      log(`✓ ${path.split('/').pop()}  ${Math.round(origSize/1024)}KB → ${Math.round(compBlob.size/1024)}KB  (${savedKb}KB 절감)`, 'ok');

    } catch(e) {
      log(`오류: ${path.split('/').pop()} — ${e.message}`, 'err');
    }

    totalDone++;
    updateUI();
  }

  running = false;
  document.getElementById('stop-btn').style.display  = 'none';
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('bar').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  log(`🎉 완료! ${totalOk}개 압축, ${(totalSavedBytes/1024/1024).toFixed(1)}MB 절감`, 'ok');
}

function stopCompress(){
  running = false;
  log('중단 요청됨. 현재 파일 처리 후 멈춥니다.', 'info');
}
</script>
</body>
</html>
